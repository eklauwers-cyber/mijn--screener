name: Daily Stock Scan

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen uit repository
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Benodigde bibliotheken installeren
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests supabase

      - name: Achtergrondscanner uitvoeren
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python background_scanner.py
